<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>執筆進捗・公開デモ</title><link rel="stylesheet" href="./writing_status.css"><link rel="stylesheet" href="../shared/demo.css"><main class="app-shell writing-status-view"><section class="demo-intro"><a href="../index.html">← 3つの制作デモ</a><p>WRITING STATUS / 閲覧専用</p><h1>書けた章と、次に書く章を見つける。</h1><p>架空の5章で執筆工程と残件を確認。工程を絞り、関連メモを開いて次の作業を選べます。</p><div class="demo-steps"><b>1. 全体の件数を見る</b><b>2. 「初稿執筆中」に絞る</b><b>3. 合成のプロットを確認する</b></div><p>原典の表示・集計・絞り込みを再利用。工程編集やGitHub接続は行いません。</p><button id="demo-reset">合成例に戻す</button><button id="demo-export">合成データJSONを書出し</button><label>JSONで表示を復元 <input id="demo-import" type="file" accept=".json,application/json"></label><p id="demo-status" role="status"></p></section><section class="writing-content"><div id="writingSummaryCards" class="writing-summary-cards"></div><section class="writing-toolbar"><label>執筆工程で絞り込み <select id="writingStageFilter"></select></label><p id="writingStatusMessage"></p><div id="writingStageCounts" class="writing-stage-counts"></div></section><h2>架空作品の章別進捗</h2><p>入力に登録された章のみ集計。期限未設定を完了と推定しません。</p><div id="writingIssueList" class="writing-issues"></div></section><footer class="demo-footer">ブラウザ内の表示条件を変更するデモです。入力ファイル自体を書き換えません。</footer></main><script type="module" src="./demo.js"></script></html>
